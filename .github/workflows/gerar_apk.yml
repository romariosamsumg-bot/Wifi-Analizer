name: Gerar Scanner Wi-Fi Automatico

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Criar Estrutura Android e Permissoes
        run: |
          flutter create --platforms=android scanner_wifi
          cd scanner_wifi
          flutter pub add wifi_scan permission_handler

          sed -i '/<application/i <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n<uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Inserir Codigo do Scanner Automatico
        run: |
          cat << 'EOF' > scanner_wifi/lib/main.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:wifi_scan/wifi_scan.dart';
          import 'package:permission_handler/permission_handler.dart';

          void main() => runApp(const WifiScannerApp());

          class WifiScannerApp extends StatelessWidget {
            const WifiScannerApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Auditor Wi-Fi',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0B1120),
                  colorScheme: const ColorScheme.dark(primary: Color(0xFF38BDF8)),
                ),
                home: const NetworkListScreen(),
              );
            }
          }

          class NetworkListScreen extends StatefulWidget {
            const NetworkListScreen({super.key});
            @override
            State<NetworkListScreen> createState() => _NetworkListScreenState();
          }

          class _NetworkListScreenState extends State<NetworkListScreen> {
            List<WiFiAccessPoint> networks = [];
            bool scanning = false;

            @override
            void initState() {
              super.initState();
              startRadar();
            }

            Future<void> startRadar() async {
              setState(() => scanning = true);
              await Permission.locationWhenInUse.request();

              if (await WiFiScan.instance.canStartScan() == CanStartScan.yes) {
                await WiFiScan.instance.startScan();
                await Future.delayed(const Duration(seconds: 1));
                final results = await WiFiScan.instance.getScannedResults();
                results.removeWhere((ap) => ap.ssid.trim().isEmpty);
                results.sort((a, b) => b.level.compareTo(a.level));
                setState(() => networks = results);
              }
              setState(() => scanning = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('📡 Redes Próximas Encontradas'),
                  backgroundColor: const Color(0xFF1E293B),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.refresh),
                      onPressed: startRadar,
                    )
                  ],
                ),
                body: scanning
                    ? const Center(
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            CircularProgressIndicator(),
                            SizedBox(height: 16),
                            Text('Varrendo sinais de rádio Wi-Fi próximos...'),
                          ],
                        ),
                      )
                    : networks.isEmpty
                        ? Center(
                            child: Padding(
                              padding: const EdgeInsets.all(24),
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  const Icon(Icons.location_off, size: 56, color: Colors.amber),
                                  const SizedBox(height: 12),
                                  const Text(
                                    'Nenhuma rede listada. Certifique-se de que o Wi-Fi e a Localização (GPS) do celular estão ligados.',
                                    textAlign: TextAlign.center,
                                  ),
                                  const SizedBox(height: 16),
                                  ElevatedButton(
                                    onPressed: startRadar,
                                    child: const Text('Escanear Novamente'),
                                  )
                                ],
                              ),
                            ),
                          )
                        : ListView.builder(
                            padding: const EdgeInsets.all(12),
                            itemCount: networks.length,
                            itemBuilder: (context, index) {
                              final ap = networks[index];
                              final is5G = ap.frequency >= 5000;
                              return Card(
                                color: const Color(0xFF1E293B),
                                margin: const EdgeInsets.only(bottom: 10),
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                child: ListTile(
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                                  leading: Icon(
                                    Icons.wifi,
                                    color: ap.level > -65 ? Colors.greenAccent : Colors.amberAccent,
                                    size: 32,
                                  ),
                                  title: Text(
                                    ap.ssid,
                                    style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16),
                                  ),
                                  subtitle: Text(
                                    'Sinal: ${ap.level} dBm • ${is5G ? "5 GHz" : "2.4 GHz"}\nMAC: ${ap.bssid.toUpperCase()}',
                                    style: const TextStyle(fontSize: 12, color: Colors.white70),
                                  ),
                                  trailing: ElevatedButton(
                                    style: ElevatedButton.styleFrom(
                                      backgroundColor: const Color(0xFF38BDF8),
                                      foregroundColor: Colors.black,
                                    ),
                                    onPressed: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => AuditTestScreen(ap: ap),
                                        ),
                                      );
                                    },
                                    child: const Text('TESTAR', style: TextStyle(fontWeight: FontWeight.bold)),
                                  ),
                                ),
                              );
                            },
                          ),
              );
            }
          }

          class AuditTestScreen extends StatefulWidget {
            final WiFiAccessPoint ap;
            const AuditTestScreen({super.key, required this.ap});

            @override
            State<AuditTestScreen> createState() => _AuditTestScreenState();
          }

          class _AuditTestScreenState extends State<AuditTestScreen> {
            int currentStep = 0;
            bool finished = false;
            final List<String> logs = [];

            @override
            void initState() {
              super.initState();
              runAutomatedTests();
            }

            Future<void> runAutomatedTests() async {
              final steps = [
                'Capturando pacote Beacon de ${widget.ap.ssid}...',
                'Inspecionando protocolo de criptografia (RSN/WPA)...',
                'Testando exposição da porta WPS (PIN 8 dígitos)...',
                'Verificando blindagem contra desconexão (PMF 802.11w)...',
                'Checando assinatura de fábrica no SSID e MAC (${widget.ap.bssid})...',
                'Calculando nota final de segurança...'
              ];

              for (int i = 0; i < steps.length; i++) {
                await Future.delayed(const Duration(milliseconds: 550));
                if (!mounted) return;
                setState(() {
                  currentStep = i + 1;
                  logs.add(steps[i]);
                });
              }

              await Future.delayed(const Duration(milliseconds: 400));
              if (!mounted) return;
              setState(() => finished = true);
            }

            Map<String, dynamic> buildReport() {
              int score = 100;
              int maxCap = 100;
              final List<Map<String, String>> vulns = [];
              final caps = widget.ap.capabilities.toUpperCase();
              final ssid = widget.ap.ssid.toUpperCase();

              // 1. Criptografia
              if (!caps.contains('WPA') && !caps.contains('RSN') && !caps.contains('WEP')) {
                score -= 80;
                maxCap = 20;
                vulns.add({
                  'severity': 'CRÍTICO',
                  'title': 'Rede Aberta (Sem Senha de Proteção)',
                  'detail': 'O roteador não exige autenticação. Qualquer pessoa dentro do alcance pode interceptar o tráfego.',
                  'fix': 'Ative imediatamente o modo WPA2-AES (CCMP) ou WPA3 no roteador.'
                });
              } else if (caps.contains('WEP')) {
                score -= 80;
                maxCap = 20;
                vulns.add({
                  'severity': 'CRÍTICO',
                  'title': 'Criptografia WEP Detectada (-80 pts)',
                  'detail': 'O protocolo WEP é obsoleto e possui falhas matemáticas que revelam a chave em poucos minutos.',
                  'fix': 'Altere a segurança do Wi-Fi para WPA2 (AES) ou WPA3.'
                });
              } else if (caps.contains('TKIP')) {
                score -= 35;
                vulns.add({
                  'severity': 'ALTO',
                  'title': 'Protocolo Antigo TKIP Ativo (-35 pts)',
                  'detail': 'A rede aceita o padrão antigo TKIP, que facilita ataques ao aperto de mão (Handshake) da senha.',
                  'fix': 'No painel do roteador, mude de "WPA/WPA2 Misto" para "Apenas WPA2 (AES/CCMP)".'
                });
              } else if (!caps.contains('SAE')) {
                score -= 10;
                vulns.add({
                  'severity': 'INFORMATIVO',
                  'title': 'WPA3 Não Ativado (-10 pts)',
                  'detail': 'A rede usa WPA2. É seguro se a senha for longa, mas ainda permite que alguém capture o sinal para tentar adivinhar senhas fracas.',
                  'fix': 'Se o roteador for recente, ative o WPA3 (SAE) ou use uma senha com mais de 14 caracteres.'
                });
              }

              // 2. WPS
              if (caps.contains('WPS')) {
                score -= 30;
                if (maxCap > 65) maxCap = 65;
                vulns.add({
                  'severity': 'ALTO',
                  'title': 'Brecha WPS Ativa no Rádio (-30 pts)',
                  'detail': 'O roteador anunciou que o WPS está ligado. Essa função tem um PIN de 8 números que pode ser descoberto para revelar a senha do Wi-Fi.',
                  'fix': 'Entre nas configurações do roteador, vá em Wi-Fi -> WPS e mude para Desativado.'
                });
              }

              // 3. PMF (802.11w)
              if (!caps.contains('MFPC') && !caps.contains('MFPR') && !caps.contains('SAE')) {
                score -= 10;
                vulns.add({
                  'severity': 'MÉDIO',
                  'title': 'Desconexão Forçada Permitida (Sem PMF) (-10 pts)',
                  'detail': 'Os pacotes de controle não são protegidos. Um aparelho externo pode derrubar celulares e câmeras do Wi-Fi à distância.',
                  'fix': 'Ative a opção PMF (Protected Management Frames / 802.11w) nas opções avançadas do Wi-Fi.'
                });
              }

              // 4. Padrão de Operadora / Fábrica
              if (RegExp(r'(CLARO|VIVO|TIM|OI|NET|FIBRA|BRISANET|TP-LINK|INTELBRAS|HUAWEI|D-LINK|TENDA|2G|5G)').hasMatch(ssid)) {
                score -= 15;
                vulns.add({
                  'severity': 'MÉDIO',
                  'title': 'Assinatura de Padrão de Fábrica (-15 pts)',
                  'detail': 'O nome da rede mantém o padrão de operadora ou fabricante. Redes assim frequentemente ainda usam a senha original da etiqueta.',
                  'fix': 'Personalize o nome da rede e troque a senha original que veio impressa no adesivo do roteador.'
                });
              }

              if (score < 0) score = 0;
              if (score > maxCap) score = maxCap;

              return {'score': score, 'vulns': vulns};
            }

            @override
            Widget build(BuildContext context) {
              if (!finished) {
                return Scaffold(
                  appBar: AppBar(title: Text('Testando ${widget.ap.ssid}...')),
                  body: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        const Center(child: CircularProgressIndicator()),
                        const SizedBox(height: 24),
                        Text(
                          'Analisando Camadas de Segurança (${currentStep}/6)',
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                        ),
                        const SizedBox(height: 20),
                        Container(
                          padding: const EdgeInsets.all(16),
                          decoration: BoxDecoration(
                            color: Colors.black54,
                            borderRadius: BorderRadius.circular(12),
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: logs
                                .map((l) => Padding(
                                      padding: const EdgeInsets.only(bottom: 6),
                                      child: Text('> $l', style: const TextStyle(fontFamily: 'monospace', color: Colors.greenAccent, fontSize: 13)),
                                    ))
                                .toList(),
                          ),
                        ),
                      ],
                    ),
                  ),
                );
              }

              final report = buildReport();
              final int score = report['score'];
              final List<Map<String, String>> vulns = report['vulns'];
              final Color col = score < 60 ? Colors.redAccent : (score < 85 ? Colors.amberAccent : Colors.greenAccent);

              return Scaffold(
                appBar: AppBar(
                  title: Text('Resultado: ${widget.ap.ssid}'),
                  backgroundColor: const Color(0xFF1E293B),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(24),
                      decoration: BoxDecoration(
                        color: const Color(0xFF1E293B),
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(color: col, width: 2),
                      ),
                      child: Column(
                        children: [
                          Text('$score / 100', style: TextStyle(fontSize: 48, fontWeight: FontWeight.bold, color: col)),
                          const SizedBox(height: 4),
                          Text(
                            score < 60 ? '🚨 REDE VULNERÁVEL' : (score < 85 ? '⚠️ SEGURANÇA MEDIANA' : '🛡️ REDE BLINDADA'),
                            style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: col),
                          ),
                          const SizedBox(height: 12),
                          Text(
                            'Flags lidas pelo ar: ${widget.ap.capabilities}',
                            style: const TextStyle(fontSize: 11, color: Colors.white54),
                            textAlign: TextAlign.center,
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text('Diagnóstico Detalhado:', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    ...vulns.map((v) => Card(
                          color: const Color(0xFF1E293B),
                          margin: const EdgeInsets.only(bottom: 12),
                          child: Padding(
                            padding: const EdgeInsets.all(16),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text('[${v['severity']}] ${v['title']}',
                                    style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: Colors.amberAccent)),
                                const SizedBox(height: 8),
                                Text('Por que é um risco: ${v['detail']}', style: const TextStyle(color: Colors.white70)),
                                const SizedBox(height: 10),
                                Container(
                                  padding: const EdgeInsets.all(10),
                                  decoration: BoxDecoration(
                                    color: Colors.green.withOpacity(0.15),
                                    borderRadius: BorderRadius.circular(8),
                                  ),
                                  child: Text('💡 Como melhorar: ${v['fix']}',
                                      style: const TextStyle(color: Colors.lightGreenAccent, fontWeight: FontWeight.w600)),
                                ),
                              ],
                            ),
                          ),
                        )),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Compilar APK Release
        run: |
          cd scanner_wifi
          flutter build apk --release

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Auditor-WiFi-Automatico
          path: scanner_wifi/build/app/outputs/flutter-apk/app-release.apk

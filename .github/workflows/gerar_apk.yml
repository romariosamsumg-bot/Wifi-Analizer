name: Criar App Completo e Gerar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Criar Projeto e Configurar Permissoes Android
        run: |
          flutter create --platforms=android escudo_wifi
          cd escudo_wifi
          flutter pub add wifi_scan permission_handler network_info_plus url_launcher

          # Injeta permissoes de leitura de Wi-Fi no AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n<uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Escrever Codigo do Aplicativo
        run: |
          cat << 'EOF' > escudo_wifi/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:wifi_scan/wifi_scan.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:network_info_plus/network_info_plus.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() => runApp(const EscudoWifiApp());

          class EscudoWifiApp extends StatelessWidget {
            const EscudoWifiApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Escudo Wi-Fi',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                ),
                home: const HomePage(),
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});
            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            List<WiFiAccessPoint> networks = [];
            WiFiAccessPoint? selected;
            String gatewayIp = '192.168.0.1';
            String passwordTest = '';
            bool loading = false;

            @override
            void initState() {
              super.initState();
              scanWifi();
            }

            Future<void> scanWifi() async {
              setState(() => loading = true);
              await Permission.locationWhenInUse.request();
              final gw = await NetworkInfo().getWifiGatewayIP();
              if (gw != null && gw.isNotEmpty) gatewayIp = gw;

              if (await WiFiScan.instance.canStartScan() == CanStartScan.yes) {
                await WiFiScan.instance.startScan();
                final res = await WiFiScan.instance.getScannedResults();
                res.removeWhere((e) => e.ssid.isEmpty);
                res.sort((a, b) => b.level.compareTo(a.level));
                setState(() {
                  networks = res;
                  if (networks.isNotEmpty) selected = networks.first;
                });
              }
              setState(() => loading = false);
            }

            Map<String, dynamic> evaluate(WiFiAccessPoint ap, String pass) {
              int score = 100;
              int cap = 100;
              List<Map<String, String>> issues = [];
              final c = ap.capabilities.toUpperCase();
              final s = ap.ssid.toUpperCase();

              if (!c.contains('WPA') && !c.contains('RSN') && !c.contains('WEP')) {
                score -= 80; cap = 20;
                issues.add({'t': 'Rede Aberta (Sem Senha)', 'f': 'Ative WPA2-AES ou WPA3 no roteador.'});
              } else if (c.contains('WEP') || c.contains('TKIP')) {
                score -= 35;
                issues.add({'t': 'Fechadura Antiga (TKIP/WEP)', 'f': 'Mude a segurança para Apenas WPA2 (AES) ou WPA3.'});
              }

              if (c.contains('WPS')) {
                score -= 30; if (cap > 65) cap = 65;
                issues.add({'t': 'Botão WPS Ligado (-30 pts)', 'f': 'Desative o WPS no painel do roteador para fechar a brecha do PIN de 8 dígitos.'});
              }

              if (RegExp(r'(CLARO|VIVO|TIM|OI|NET|FIBRA|TP-LINK|INTELBRAS)').hasMatch(s)) {
                score -= 15;
                issues.add({'t': 'Nome de Fábrica Detectado (-15 pts)', 'f': 'Troque o nome do Wi-Fi e não use a senha colada na etiqueta do aparelho.'});
              }

              if (!c.contains('MFPC') && !c.contains('SAE')) {
                score -= 10;
                issues.add({'t': 'Proteção Anti-Queda (PMF) Desligada (-10 pts)', 'f': 'Ative o PMF (802.11w) ou WPA3 para impedir que desconectem seus aparelhos.'});
              }

              if (pass.isNotEmpty && (pass.length < 10 || RegExp(r'^[0-9]+$').hasMatch(pass))) {
                score -= 40; if (cap > 50) cap = 50;
                issues.add({'t': 'Senha Fraca ou Curta (-40 pts)', 'f': 'Use pelo menos 14 caracteres misturando letras, números e símbolos.'});
              }

              if (score < 0) score = 0;
              if (score > cap) score = cap;
              return {'score': score, 'issues': issues};
            }

            @override
            Widget build(BuildContext context) {
              final data = selected != null ? evaluate(selected!, passwordTest) : {'score': 0, 'issues': <Map<String, String>>[]};
              final int score = data['score'];
              final List<Map<String, String>> issues = data['issues'];
              final Color col = score < 60 ? Colors.redAccent : (score < 85 ? Colors.amberAccent : Colors.greenAccent);

              return Scaffold(
                appBar: AppBar(
                  title: const Text('🛡️ Escudo Wi-Fi'),
                  backgroundColor: const Color(0xFF1E293B),
                  actions: [IconButton(icon: const Icon(Icons.refresh), onPressed: scanWifi)],
                ),
                body: loading
                    ? const Center(child: CircularProgressIndicator())
                    : ListView(
                        padding: const EdgeInsets.all(16),
                        children: [
                          DropdownButtonFormField<WiFiAccessPoint>(
                            value: selected,
                            decoration: const InputDecoration(labelText: 'Rede Wi-Fi Escaneada pelo Ar', border: OutlineInputBorder()),
                            items: networks.map((ap) => DropdownMenuItem(value: ap, child: Text('${ap.ssid} (${ap.level} dBm)'))).toList(),
                            onChanged: (v) => setState(() => selected = v),
                          ),
                          const SizedBox(height: 16),
                          Container(
                            padding: const EdgeInsets.all(20),
                            decoration: BoxDecoration(
                              color: const Color(0xFF1E293B),
                              borderRadius: BorderRadius.circular(16),
                              border: Border.all(color: col, width: 2),
                            ),
                            child: Column(
                              children: [
                                Text('$score / 100', style: TextStyle(fontSize: 44, fontWeight: FontWeight.bold, color: col)),
                                Text(score < 60 ? 'Rede Vulnerável' : (score < 85 ? 'Atenção Necessária' : 'Rede Blindada'),
                                    style: TextStyle(fontSize: 18, color: col)),
                                if (selected != null)
                                  Padding(
                                    padding: const EdgeInsets.only(top: 8),
                                    child: Text('Leitura do Rádio: ${selected!.capabilities}',
                                        style: const TextStyle(fontSize: 11, color: Colors.white54), textAlign: TextAlign.center),
                                  ),
                              ],
                            ),
                          ),
                          const SizedBox(height: 14),
                          TextField(
                            obscureText: true,
                            decoration: const InputDecoration(
                              labelText: 'Simular resistência da senha (Opcional)',
                              border: OutlineInputBorder(),
                            ),
                            onChanged: (v) => setState(() => passwordTest = v),
                          ),
                          const SizedBox(height: 16),
                          ...issues.map((i) => Card(
                                color: const Color(0xFF1E293B),
                                child: ListTile(
                                  title: Text('⚠️ ${i['t']}', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.amberAccent)),
                                  subtitle: Text('💡 Solução: ${i['f']}\n', style: const TextStyle(color: Colors.lightGreenAccent)),
                                ),
                              )),
                          const SizedBox(height: 12),
                          ElevatedButton.icon(
                            icon: const Icon(Icons.router),
                            label: Text('Abrir Painel do Roteador ($gatewayIp)'),
                            onPressed: () => launchUrl(Uri.parse('http://$gatewayIp'), mode: LaunchMode.externalApplication),
                          ),
                        ],
                      ),
              );
            }
          }
          EOF

      - name: Compilar APK
        run: |
          cd escudo_wifi
          flutter build apk --release

      - name: Disponibilizar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Escudo-WiFi-Instalador
          path: escudo_wifi/build/app/outputs/flutter-apk/app-release.apk
